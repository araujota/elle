[project]
name = "elle"
version = "0.1.0"
description = "Enabling Layer Learning Everything - A local-first, agentic system layer for Ubuntu"
readme = "README.md"
license = {text = "GPL-3.0-or-later"}
requires-python = ">=3.10"
authors = [
    {name = "ELLE Contributors"}
]
keywords = ["linux", "ubuntu", "system-administration", "ai", "local-first"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Systems Administration",
]

dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-augeas>=1.1.0",
    "ruamel.yaml>=0.18.0",
    "rich>=13.0",
    "prompt_toolkit>=3.0",
    "toml>=0.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-toml>=0.10",
]
api = [
    "fastapi>=0.111",
    "uvicorn>=0.30",
]
ebpf = [
    "bcc>=0.28.0",
]
mobile = [
    "cryptography>=41.0.0",
    "qrcode[pil]>=7.4.2",
    "aiohttp>=3.9.0",
]

[project.scripts]
elle = "elle.cli.oneshot:main"
elled = "elle.daemon.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/elle"]

[tool.ruff]
target-version = "py310"
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # Line too long - handled by formatter
    "B007",   # Unused loop variable - sometimes intentional
    "B008",   # Function call in default argument - often intentional
    "B017",   # pytest.raises(Exception) - acceptable in tests
    "E741",   # Ambiguous variable name (l, O, I) - context-dependent
    "SIM102", # Nested if - sometimes clearer than combined
    "SIM105", # contextlib.suppress - try/except often clearer
    "SIM108", # Ternary operator - sometimes less readable
    "SIM110", # Use any() - for loop often clearer
    "SIM115", # Context manager for files - sometimes impractical
    "SIM117", # Nested with - sometimes clearer than combined
    "N806",   # Variable in function should be lowercase - sometimes intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B017", "B018"]  # Allow broader exception handling in tests

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = [
    "cryptography.*",
    "bcc.*",
    "gi.*",
    "inotify_simple.*",
    "aiohttp.*",
    "uvicorn.*",
    "qrcode.*",
    "augeas.*",
    "prompt_toolkit.*",
    "rich.*",
    "croniter.*",
    "yaml.*",
    "ruamel.*",
    "fastapi.*",
    "tomli.*",
    "tomllib",
    "toml",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
