name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  # ============================================================================
  # Lint and Type Check
  # ============================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libaugeas-dev augeas-tools

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -e ".[dev]"

      - name: Run ruff check
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format src/ tests/ --check

      - name: Run mypy
        run: mypy src/
        continue-on-error: true  # Type errors shouldn't block CI yet

  # ============================================================================
  # Test Suite
  # ============================================================================
  test:
    name: Test Suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libaugeas-dev augeas-tools

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=elle --cov-report=xml --cov-report=term-missing \
            --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml
          retention-days: 7

  # ============================================================================
  # Build Debian Package
  # ============================================================================
  build:
    name: Build .deb Package
    runs-on: ubuntu-24.04
    outputs:
      deb_name: ${{ steps.build.outputs.deb_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            dpkg-dev \
            python3-dev \
            python3-pip \
            python3-venv \
            python3-build \
            libaugeas-dev \
            augeas-tools

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Build Debian package
        id: build
        run: |
          make build-deb
          DEB_FILE=$(ls build/elle_*.deb | head -1)
          DEB_NAME=$(basename "$DEB_FILE")
          echo "deb_name=$DEB_NAME" >> "$GITHUB_OUTPUT"
          echo "Built: $DEB_NAME"

      - name: Verify package structure
        run: |
          DEB_FILE=$(ls build/elle_*.deb | head -1)
          echo "=== Package Info ==="
          dpkg-deb -I "$DEB_FILE"
          echo ""
          echo "=== Package Contents ==="
          dpkg-deb -c "$DEB_FILE"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: build/elle_*.deb
          retention-days: 7

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            build/
            dist/
          retention-days: 7

  # ============================================================================
  # Lintian - Debian Policy Compliance
  # ============================================================================
  lintian:
    name: Lintian Check
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: build/

      - name: Install lintian
        run: sudo apt-get update && sudo apt-get install -y lintian

      - name: Run lintian
        id: lintian
        run: |
          DEB_FILE=$(ls build/elle_*.deb | head -1)
          echo "Running lintian on $DEB_FILE"
          # Run lintian with informational output, fail on errors/warnings
          lintian --verbose --info "$DEB_FILE" 2>&1 | tee lintian-output.txt
          # Check for errors (E:) or warnings (W:)
          if grep -qE "^(E|W):" lintian-output.txt; then
            echo "::error::Lintian found errors or warnings"
            echo "errors_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "errors_found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload lintian output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lintian-output
          path: lintian-output.txt
          retention-days: 7

      - name: Fail if lintian found issues
        if: steps.lintian.outputs.errors_found == 'true'
        run: |
          echo "Lintian found the following issues:"
          grep -E "^(E|W):" lintian-output.txt
          exit 1

  # ============================================================================
  # piuparts - Install/Remove/Purge Test
  # ============================================================================
  piuparts:
    name: piuparts Install/Remove/Purge
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: build/

      - name: Install piuparts
        id: install-piuparts
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          # piuparts may not be available in all Ubuntu versions
          if apt-cache show piuparts &> /dev/null; then
            sudo apt-get install -y piuparts debootstrap
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::piuparts not available in this Ubuntu version, skipping"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run piuparts
        if: steps.install-piuparts.outputs.available == 'true'
        run: |
          DEB_FILE=$(ls build/elle_*.deb | head -1)
          echo "Running piuparts on $DEB_FILE"
          # Run piuparts with some tolerance for pip-installed packages
          sudo piuparts \
            --distribution=noble \
            --mirror=http://archive.ubuntu.com/ubuntu \
            --warn-on-debsums-errors \
            --warn-on-leftovers-after-purge \
            --log-file=piuparts.log \
            "$DEB_FILE" 2>&1 | tee piuparts-output.txt || true

          # Check for FAIL in output
          if grep -q "FAIL" piuparts-output.txt; then
            echo "::error::piuparts detected failures"
            cat piuparts.log
            exit 1
          fi

      - name: Upload piuparts logs
        uses: actions/upload-artifact@v4
        if: always() && steps.install-piuparts.outputs.available == 'true'
        with:
          name: piuparts-logs
          path: |
            piuparts.log
            piuparts-output.txt
          retention-days: 7

  # ============================================================================
  # autopkgtest - Full VM Tests
  # ============================================================================
  autopkgtest-qemu:
    name: autopkgtest (${{ matrix.release }})
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        release: [jammy, noble]
        include:
          - release: jammy
            image_url: https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img
          - release: noble
            image_url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
    steps:
      - uses: actions/checkout@v4

      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: build/

      - name: Install autopkgtest and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autopkgtest \
            qemu-system-x86 \
            qemu-utils \
            cloud-image-utils \
            wget

      - name: Download Ubuntu cloud image
        run: |
          mkdir -p images
          wget -q -O images/${{ matrix.release }}.img "${{ matrix.image_url }}"
          qemu-img resize images/${{ matrix.release }}.img 10G

      - name: Prepare autopkgtest image
        run: |
          # Create a copy for autopkgtest to work with
          autopkgtest-buildvm-ubuntu-cloud \
            --release ${{ matrix.release }} \
            --disk-size 10G \
            --output-dir images/ || true

          # If buildvm fails, use the downloaded image directly
          if [[ ! -f images/autopkgtest-${{ matrix.release }}.img ]]; then
            cp images/${{ matrix.release }}.img images/autopkgtest-${{ matrix.release }}.img
          fi

      - name: Run autopkgtest
        run: |
          DEB_FILE=$(ls build/elle_*.deb | head -1)
          mkdir -p results

          # Run autopkgtest with QEMU backend
          sudo autopkgtest \
            "$DEB_FILE" \
            --timeout-factor=3 \
            --output-dir=results \
            -- qemu images/autopkgtest-${{ matrix.release }}.img \
            2>&1 | tee autopkgtest-${{ matrix.release }}.log || {
              EXIT_CODE=$?
              echo "autopkgtest exited with code $EXIT_CODE"
              if [[ $EXIT_CODE -eq 2 ]]; then
                echo "::error::autopkgtest: some tests failed"
              elif [[ $EXIT_CODE -eq 4 ]]; then
                echo "::error::autopkgtest: testbed setup failed"
              elif [[ $EXIT_CODE -eq 8 ]]; then
                echo "::error::autopkgtest: no tests found"
              fi
              exit $EXIT_CODE
            }

      - name: Upload autopkgtest results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autopkgtest-${{ matrix.release }}
          path: |
            results/
            autopkgtest-${{ matrix.release }}.log
          retention-days: 7

  # ============================================================================
  # SonarQube Analysis (commented out - enable when available)
  # ============================================================================
  # sonarqube:
  #   name: SonarQube Analysis
  #   runs-on: ubuntu-24.04
  #   needs: test
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         fetch-depth: 0  # Full history for better analysis
  #
  #     - name: Download coverage report
  #       uses: actions/download-artifact@v4
  #       with:
  #         name: test-results
  #
  #     - name: SonarQube Scan
  #       uses: SonarSource/sonarqube-scan-action@master
  #       env:
  #         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  #         SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  #       with:
  #         args: >
  #           -Dsonar.projectKey=elle
  #           -Dsonar.python.coverage.reportPaths=coverage.xml
  #           -Dsonar.sources=src/
  #           -Dsonar.tests=tests/

  # ============================================================================
  # CI Summary
  # ============================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-24.04
    needs: [lint, test, build, lintian, piuparts, autopkgtest-qemu]
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "=== CI Summary ==="
          echo "Lint: ${{ needs.lint.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"
          echo "Lintian: ${{ needs.lintian.result }}"
          echo "piuparts: ${{ needs.piuparts.result }}"
          echo "autopkgtest: ${{ needs.autopkgtest-qemu.result }}"

          # Fail if any required job failed
          if [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.test.result }}" == "failure" ]] || \
             [[ "${{ needs.build.result }}" == "failure" ]] || \
             [[ "${{ needs.lintian.result }}" == "failure" ]] || \
             [[ "${{ needs.piuparts.result }}" == "failure" ]] || \
             [[ "${{ needs.autopkgtest-qemu.result }}" == "failure" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi

          echo "All CI checks passed!"
