name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.10"

jobs:
  # ============================================================================
  # Lint and Type Check
  # ============================================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libaugeas-dev augeas-tools

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy
          pip install -e ".[dev,api]"

      - name: Run ruff check
        run: ruff check src/ tests/

      - name: Run ruff format check
        run: ruff format src/ tests/ --check

      - name: Run mypy
        run: mypy src/

  # ============================================================================
  # Test Suite
  # ============================================================================
  test:
    name: Test Suite
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libaugeas-dev augeas-tools

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: Run tests with coverage
        run: |
          pytest tests/ -v --cov=elle --cov-report=xml --cov-report=term-missing \
            --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            test-results.xml
            coverage.xml
          retention-days: 7

  # ============================================================================
  # Build Debian Package
  # ============================================================================
  build:
    name: Build .deb Package
    runs-on: ubuntu-24.04
    outputs:
      deb_name: ${{ steps.build.outputs.deb_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            dpkg-dev \
            fakeroot \
            python3-dev \
            python3-pip \
            python3-venv \
            python3-build \
            libaugeas-dev \
            augeas-tools

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel

      - name: Build Debian package
        id: build
        run: |
          make build-deb
          DEB_FILE=$(ls build/elle_*.deb | head -1)
          DEB_NAME=$(basename "$DEB_FILE")
          echo "deb_name=$DEB_NAME" >> "$GITHUB_OUTPUT"
          echo "Built: $DEB_NAME"

      - name: Verify package structure
        run: |
          DEB_FILE=$(ls build/elle_*.deb | head -1)
          echo "=== Package Info ==="
          dpkg-deb -I "$DEB_FILE"
          echo ""
          echo "=== Package Contents ==="
          dpkg-deb -c "$DEB_FILE"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: build/elle_*.deb
          retention-days: 7

      - name: Upload build logs on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: build-logs
          path: |
            build/
            dist/
          retention-days: 7

  # ============================================================================
  # Lintian - Debian Policy Compliance
  # ============================================================================
  lintian:
    name: Lintian Check
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: build/

      - name: Install lintian
        run: sudo apt-get update && sudo apt-get install -y lintian

      - name: Run lintian
        id: lintian
        run: |
          DEB_FILE=$(ls build/elle_*.deb | head -1)
          echo "Running lintian on $DEB_FILE"
          # Run lintian with informational output
          lintian --verbose --info "$DEB_FILE" 2>&1 | tee lintian-output.txt
          # Check for errors only (E:) - warnings (W:) are logged but don't fail
          if grep -qE "^E:" lintian-output.txt; then
            echo "::error::Lintian found errors"
            echo "errors_found=true" >> "$GITHUB_OUTPUT"
          else
            echo "errors_found=false" >> "$GITHUB_OUTPUT"
          fi
          # Log warnings for visibility
          if grep -qE "^W:" lintian-output.txt; then
            echo "::warning::Lintian found warnings (non-fatal)"
            grep "^W:" lintian-output.txt
          fi

      - name: Upload lintian output
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lintian-output
          path: lintian-output.txt
          retention-days: 7

      - name: Fail if lintian found errors
        if: steps.lintian.outputs.errors_found == 'true'
        run: |
          echo "Lintian found the following errors:"
          grep "^E:" lintian-output.txt
          exit 1

  # ============================================================================
  # piuparts - Install/Remove/Purge Test
  # ============================================================================
  piuparts:
    name: piuparts Install/Remove/Purge
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: build/

      - name: Install piuparts
        id: install-piuparts
        run: |
          sudo add-apt-repository -y universe
          sudo apt-get update
          # piuparts may not be available in all Ubuntu versions (not in noble)
          if sudo apt-get install -y piuparts debootstrap 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::piuparts not available in this Ubuntu version, skipping"
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run piuparts
        if: steps.install-piuparts.outputs.available == 'true'
        run: |
          DEB_FILE=$(ls build/elle_*.deb | head -1)
          echo "Running piuparts on $DEB_FILE"
          # Run piuparts with some tolerance for pip-installed packages
          sudo piuparts \
            --distribution=noble \
            --mirror=http://archive.ubuntu.com/ubuntu \
            --warn-on-debsums-errors \
            --warn-on-leftovers-after-purge \
            --log-file=piuparts.log \
            "$DEB_FILE" 2>&1 | tee piuparts-output.txt || true

          # Check for FAIL in output
          if grep -q "FAIL" piuparts-output.txt; then
            echo "::error::piuparts detected failures"
            cat piuparts.log
            exit 1
          fi

      - name: Upload piuparts logs
        uses: actions/upload-artifact@v4
        if: always() && steps.install-piuparts.outputs.available == 'true'
        with:
          name: piuparts-logs
          path: |
            piuparts.log
            piuparts-output.txt
          retention-days: 7

  # ============================================================================
  # autopkgtest - Full VM Tests
  # ============================================================================
  autopkgtest-qemu:
    name: autopkgtest (${{ matrix.release }})
    runs-on: ubuntu-24.04
    needs: build
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        release: [jammy, noble]
        include:
          - release: jammy
            image_url: https://cloud-images.ubuntu.com/jammy/current/jammy-server-cloudimg-amd64.img
          - release: noble
            image_url: https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img
    steps:
      - uses: actions/checkout@v4

      - name: Download .deb artifact
        uses: actions/download-artifact@v4
        with:
          name: debian-package
          path: build/

      - name: Install autopkgtest and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autopkgtest \
            qemu-system-x86 \
            qemu-utils \
            cloud-image-utils \
            wget

      - name: Download Ubuntu cloud image
        run: |
          mkdir -p images
          wget -q -O images/${{ matrix.release }}.img "${{ matrix.image_url }}"
          qemu-img resize images/${{ matrix.release }}.img 10G

      - name: Prepare autopkgtest image
        run: |
          # Create a copy for autopkgtest to work with
          autopkgtest-buildvm-ubuntu-cloud \
            --release ${{ matrix.release }} \
            --disk-size 10G \
            --output-dir images/ || true

          # If buildvm fails, use the downloaded image directly
          if [[ ! -f images/autopkgtest-${{ matrix.release }}.img ]]; then
            cp images/${{ matrix.release }}.img images/autopkgtest-${{ matrix.release }}.img
          fi

      - name: Run autopkgtest
        run: |
          DEB_FILE=$(ls build/elle_*.deb | head -1)
          mkdir -p results

          # Run autopkgtest with QEMU backend
          sudo autopkgtest \
            "$DEB_FILE" \
            --timeout-factor=3 \
            --output-dir=results \
            -- qemu images/autopkgtest-${{ matrix.release }}.img \
            2>&1 | tee autopkgtest-${{ matrix.release }}.log || {
              EXIT_CODE=$?
              echo "autopkgtest exited with code $EXIT_CODE"
              if [[ $EXIT_CODE -eq 2 ]]; then
                echo "::error::autopkgtest: some tests failed"
              elif [[ $EXIT_CODE -eq 4 ]]; then
                echo "::error::autopkgtest: testbed setup failed"
              elif [[ $EXIT_CODE -eq 8 ]]; then
                echo "::error::autopkgtest: no tests found"
              fi
              exit $EXIT_CODE
            }

      - name: Upload autopkgtest results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: autopkgtest-${{ matrix.release }}
          path: |
            results/
            autopkgtest-${{ matrix.release }}.log
          retention-days: 7

  # ============================================================================
  # Security - Bandit Python Security Linter
  # ============================================================================
  security:
    name: Bandit Security Scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install Bandit
        run: pip install "bandit[toml]>=1.7"

      - name: Run Bandit
        run: bandit -c bandit.yaml -r src/ -f json -o bandit-report.json || true

      - name: Check for findings
        run: |
          if [ -f bandit-report.json ]; then
            ISSUES=$(python3 -c "import json; r=json.load(open('bandit-report.json')); print(len(r.get('results', [])))")
            echo "Bandit found $ISSUES issue(s)"
            if [ "$ISSUES" -gt 0 ]; then
              python3 -c "
          import json
          r = json.load(open('bandit-report.json'))
          for issue in r.get('results', []):
              print(f\"::error file={issue['filename']},line={issue['line_number']}::{issue['issue_text']} [{issue['test_id']}]\")
          "
              exit 1
            fi
          fi

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json
          retention-days: 7

  # ============================================================================
  # C Build - Dual Compiler (gcc + clang)
  # ============================================================================
  c-build:
    name: C Build (${{ matrix.compiler }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ${{ matrix.compiler }} \
            libjansson-dev \
            libpcre2-dev \
            libssl-dev \
            libsystemd-dev \
            pkg-config

      - name: Build telemetryd
        run: make -C ebpf/telemetryd clean all CC=${{ matrix.compiler }}

      - name: Build probed
        run: make -C ebpf/probed clean all CC=${{ matrix.compiler }}

      - name: Build gpud
        run: make -C ebpf/gpud clean all CC=${{ matrix.compiler }}

  # ============================================================================
  # C Static Analysis - clang-tidy
  # ============================================================================
  c-static-analysis:
    name: Clang-Tidy Analysis
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang-tidy \
            libjansson-dev \
            libpcre2-dev \
            libssl-dev \
            libsystemd-dev \
            pkg-config

      - name: Run clang-tidy on telemetryd
        run: |
          FILES=$(find ebpf/telemetryd -name '*.c' ! -path '*/ebpf/*')
          [ -n "$FILES" ] && \
            clang-tidy --config-file=.clang-tidy $FILES \
            -- -D_GNU_SOURCE -I ebpf/telemetryd -I ebpf/telemetryd/normalize \
            $(pkg-config --cflags jansson libpcre2-8 openssl libsystemd 2>/dev/null)

      - name: Run clang-tidy on probed
        run: |
          FILES=$(find ebpf/probed -name '*.c')
          [ -n "$FILES" ] && \
            clang-tidy --config-file=.clang-tidy $FILES \
            -- -D_GNU_SOURCE -I ebpf/probed -I ebpf/probed/probes \
            $(pkg-config --cflags jansson libsystemd openssl 2>/dev/null)

      - name: Run clang-tidy on gpud
        run: |
          FILES=$(find ebpf/gpud -name '*.c')
          [ -n "$FILES" ] && \
            clang-tidy --config-file=.clang-tidy $FILES \
            -- -D_GNU_SOURCE -I ebpf/gpud \
            $(pkg-config --cflags jansson openssl 2>/dev/null)

  # ============================================================================
  # Valgrind - Memory Checking
  # ============================================================================
  valgrind:
    name: Valgrind Memory Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            valgrind \
            libjansson-dev \
            libpcre2-dev \
            libssl-dev \
            libsystemd-dev \
            pkg-config

      - name: Build test harnesses
        run: make -C ebpf/tests valgrind-harnesses

      - name: Run Valgrind on test_normalizer
        run: |
          valgrind --leak-check=full --error-exitcode=1 --track-origins=yes \
            --show-leak-kinds=all --errors-for-leak-kinds=definite,possible \
            --suppressions=ebpf/tests/valgrind.supp \
            ebpf/tests/build/test_normalizer

      - name: Run Valgrind on test_dedup
        run: |
          valgrind --leak-check=full --error-exitcode=1 --track-origins=yes \
            --show-leak-kinds=all --errors-for-leak-kinds=definite,possible \
            --suppressions=ebpf/tests/valgrind.supp \
            ebpf/tests/build/test_dedup

      - name: Run Valgrind on test_json
        run: |
          valgrind --leak-check=full --error-exitcode=1 --track-origins=yes \
            --show-leak-kinds=all --errors-for-leak-kinds=definite,possible \
            --suppressions=ebpf/tests/valgrind.supp \
            ebpf/tests/build/test_json

      - name: Run Valgrind on test_fingerprint
        run: |
          valgrind --leak-check=full --error-exitcode=1 --track-origins=yes \
            --show-leak-kinds=all --errors-for-leak-kinds=definite,possible \
            --suppressions=ebpf/tests/valgrind.supp \
            ebpf/tests/build/test_fingerprint

  # ============================================================================
  # Fuzz Testing - AFL++
  # ============================================================================
  fuzz:
    name: AFL++ Fuzz Testing
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            afl++ \
            libjansson-dev \
            libpcre2-dev \
            libssl-dev \
            libsystemd-dev \
            pkg-config

      - name: Build fuzz harnesses
        run: make -C ebpf/fuzz all

      - name: Fuzz category_detect (5 min)
        run: |
          mkdir -p ebpf/fuzz/findings/fuzz_category
          timeout 300 afl-fuzz \
            -i ebpf/fuzz/seeds \
            -o ebpf/fuzz/findings/fuzz_category \
            -V 300 \
            -- ebpf/fuzz/build/fuzz_category 2>&1 | tail -20 || true

      - name: Fuzz fingerprint_compute (5 min)
        run: |
          mkdir -p ebpf/fuzz/findings/fuzz_fingerprint
          timeout 300 afl-fuzz \
            -i ebpf/fuzz/seeds \
            -o ebpf/fuzz/findings/fuzz_fingerprint \
            -V 300 \
            -- ebpf/fuzz/build/fuzz_fingerprint 2>&1 | tail -20 || true

      - name: Fuzz normalizer_process (5 min)
        run: |
          mkdir -p ebpf/fuzz/findings/fuzz_normalizer
          timeout 300 afl-fuzz \
            -i ebpf/fuzz/seeds \
            -o ebpf/fuzz/findings/fuzz_normalizer \
            -V 300 \
            -- ebpf/fuzz/build/fuzz_normalizer 2>&1 | tail -20 || true

      - name: Fuzz dedup_check (5 min)
        run: |
          mkdir -p ebpf/fuzz/findings/fuzz_dedup
          timeout 300 afl-fuzz \
            -i ebpf/fuzz/seeds \
            -o ebpf/fuzz/findings/fuzz_dedup \
            -V 300 \
            -- ebpf/fuzz/build/fuzz_dedup 2>&1 | tail -20 || true

      - name: Check for crashes
        run: |
          FAIL=0
          for target in fuzz_category fuzz_fingerprint fuzz_normalizer fuzz_dedup; do
            CRASH_DIR="ebpf/fuzz/findings/$target/default/crashes"
            if [ -d "$CRASH_DIR" ] && [ "$(ls -A "$CRASH_DIR" 2>/dev/null)" ]; then
              echo "::error::CRASHES FOUND in $target!"
              ls -la "$CRASH_DIR"
              FAIL=1
            else
              echo "$target: No crashes found."
            fi
          done
          if [ $FAIL -eq 1 ]; then
            exit 1
          fi

      - name: Upload fuzz findings
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuzz-findings
          path: ebpf/fuzz/findings/
          retention-days: 7

  # ============================================================================
  # Chaos Testing - Fault Injection
  # ============================================================================
  chaos:
    name: Chaos Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libaugeas-dev augeas-tools

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      - name: Run chaos tests
        run: pytest tests/chaos/ -v --timeout=60 -x --junitxml=chaos-results.xml

      - name: Upload chaos test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaos-results
          path: chaos-results.xml
          retention-days: 7

  # ============================================================================
  # Documentation - Sphinx API Docs
  # ============================================================================
  docs:
    name: Sphinx Docs Build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libaugeas-dev augeas-tools

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api,docs]"

      - name: Build Sphinx docs
        run: sphinx-build -W -b html docs/api docs/api/_build/html

      - name: Upload docs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-docs
          path: docs/api/_build/html/
          retention-days: 7

  # ============================================================================
  # SonarQube Analysis (commented out - enable when available)
  # ============================================================================
  # sonarqube:
  #   name: SonarQube Analysis
  #   runs-on: ubuntu-24.04
  #   needs: test
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         fetch-depth: 0  # Full history for better analysis
  #
  #     - name: Download coverage report
  #       uses: actions/download-artifact@v4
  #       with:
  #         name: test-results
  #
  #     - name: SonarQube Scan
  #       uses: SonarSource/sonarqube-scan-action@master
  #       env:
  #         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
  #         SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
  #       with:
  #         args: >
  #           -Dsonar.projectKey=elle
  #           -Dsonar.python.coverage.reportPaths=coverage.xml
  #           -Dsonar.sources=src/
  #           -Dsonar.tests=tests/

  # ============================================================================
  # CI Summary
  # ============================================================================
  ci-success:
    name: CI Success
    runs-on: ubuntu-24.04
    needs:
      - lint
      - test
      - security
      - c-build
      - c-static-analysis
      - valgrind
      - fuzz
      - chaos
      - docs
      - build
      - lintian
      - piuparts
      - autopkgtest-qemu
    if: always()
    steps:
      - name: Check all jobs
        run: |
          echo "=== CI Summary ==="
          echo "Lint:             ${{ needs.lint.result }}"
          echo "Test:             ${{ needs.test.result }}"
          echo "Security:         ${{ needs.security.result }}"
          echo "C Build:          ${{ needs.c-build.result }}"
          echo "C Static Analysis: ${{ needs.c-static-analysis.result }}"
          echo "Valgrind:         ${{ needs.valgrind.result }}"
          echo "Fuzz:             ${{ needs.fuzz.result }}"
          echo "Chaos:            ${{ needs.chaos.result }}"
          echo "Docs:             ${{ needs.docs.result }}"
          echo "Build:            ${{ needs.build.result }}"
          echo "Lintian:          ${{ needs.lintian.result }}"
          echo "piuparts:         ${{ needs.piuparts.result }}"
          echo "autopkgtest:      ${{ needs.autopkgtest-qemu.result }}"

          # Fail if any required job failed
          if [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.test.result }}" == "failure" ]] || \
             [[ "${{ needs.security.result }}" == "failure" ]] || \
             [[ "${{ needs.c-build.result }}" == "failure" ]] || \
             [[ "${{ needs.c-static-analysis.result }}" == "failure" ]] || \
             [[ "${{ needs.valgrind.result }}" == "failure" ]] || \
             [[ "${{ needs.fuzz.result }}" == "failure" ]] || \
             [[ "${{ needs.chaos.result }}" == "failure" ]] || \
             [[ "${{ needs.docs.result }}" == "failure" ]] || \
             [[ "${{ needs.build.result }}" == "failure" ]] || \
             [[ "${{ needs.lintian.result }}" == "failure" ]] || \
             [[ "${{ needs.piuparts.result }}" == "failure" ]] || \
             [[ "${{ needs.autopkgtest-qemu.result }}" == "failure" ]]; then
            echo "::error::One or more CI jobs failed"
            exit 1
          fi

          echo "All CI checks passed!"
