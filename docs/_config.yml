title: ELLE
description: Local-first system intelligence for Ubuntu
url: "https://araujota.github.io"
baseurl: "/elle"

# No remote theme - using custom layout
plugins: []

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor

# Navigation
nav:
  - title: Home
    url: /
    icon: home
  - title: Quick Start
    url: /install
    icon: rocket_launch
  - title: Documentation
    url: /docs
    icon: menu_book
  - title: Hardware
    url: /docs/hardware
    icon: memory

# GitHub
github_repo: https://github.com/araujota/elle
github_sponsor: https://github.com/sponsors/araujota

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: default
