title: ELLE
description: Local-first system intelligence for Ubuntu
url: "https://araujota.github.io"
baseurl: "/elle"

# No remote theme - using custom layout
plugins: []

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    block:
      line_numbers: false

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - node_modules
  - vendor
  - api

# Navigation
nav:
  - title: Home
    url: /
    icon: home
  - title: Installation
    url: https://github.com/araujota/elle/wiki/Installation
    icon: rocket_launch
  - title: Wiki
    url: https://github.com/araujota/elle/wiki
    icon: menu_book

# GitHub
github_repo: https://github.com/araujota/elle
github_sponsor: https://github.com/sponsors/araujota
github_wiki: https://github.com/araujota/elle/wiki

# Defaults
defaults:
  - scope:
      path: ""
    values:
      layout: default
